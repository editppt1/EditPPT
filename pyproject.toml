[tool.poetry]
name = "editppt"
version = "0.1.1"
description = "AI-powered PowerPoint editing agent"
authors = ["Anonymous"]
readme = "README.md"
packages = [{include = "editppt"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
python-pptx = ">=1.0.0"
pywin32 = ">=306"
openai = ">=2.0.0"
google-genai = ">=1.50.0"
loguru = ">=0.7.0"
python-dotenv = ">=1.0.0"
Pillow = ">=10.0.0"
flask = ">=3.0.0"
requests = ">=2.31.0"
tiktoken = ">=0.7.0"
mixpanel = "^5.1.0"

[tool.poetry.group.dev.dependencies]
pyinstaller = ">=6.0"

[tool.poetry.scripts]
editppt-web = "editppt.main_web:main"
editppt = "editppt.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
